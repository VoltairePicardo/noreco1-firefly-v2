<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NORECO1 Firefly v2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 3rem;
        }

        .badge {
            display: inline-block;
            background: #22c55e22;
            border: 1px solid #22c55e55;
            color: #22c55e;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.35rem 1rem;
            border-radius: 9999px;
            margin-bottom: 1.5rem;
        }

        .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

.description {
            font-size: 1rem;
            color: #94a3b8;
            max-width: 480px;
            margin: 0 auto 2.5rem;
            line-height: 1.6;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="badge">
            <span class="pulse"></span> Running
        </div>

        <h1>NORECO1 FIREFLY V.2</h1>

        <p class="description">
            Backend API server is up and running.
        </p>
    </div>
</body>
</html>
