<div class="d-flex align-items-center justify-content-between mb-2">
    <h6 class="fw-semibold text-uppercase fs-xs mb-0">Journal Entries</h6>
    <button type="button" class="btn btn-success fw-bold" (click)="addRow()">
        <ng-icon name="tablerPlus" class="ps-0 pe-2 fw-bold"></ng-icon>Add Row
    </button>
</div>
<div class="table-responsive">
    <table class="table table-custom table-centered table-hover w-100 mb-0">
        <thead class="bg-light align-middle bg-opacity-25 thead-sm">
            <tr class="text-uppercase fs-xxs">
                <th>Account</th>
                <th class="text-end" style="width:160px">Debit</th>
                <th class="text-end" style="width:160px">Credit</th>
                <th style="width:50px"></th>
                <th style="width:50px"></th>
            </tr>
        </thead>
        <tbody>
            @for (entry of entries; track $index; let i = $index) {
                <tr>
                    <td>
                        <div class="input-group input-group-sm">
                            <input type="text" class="form-control form-control-sm"
                                   [value]="getAccountLabel(entry)" readonly
                                   placeholder="Select account..."/>
                            <button type="button" class="btn btn-success btn-sm fw-bold"
                                    (click)="openAccountBrowse(i)" ngbTooltip="Browse account">
                                <ng-icon name="tablerSearch" class="ps-0 pe-0 fw-bold"></ng-icon>
                            </button>
                        </div>
                    </td>
                    <td>
                        <input type="number" class="form-control form-control-sm text-end"
                               [(ngModel)]="entries[i].debit"
                               [ngModelOptions]="{ standalone: true }"
                               min="0" placeholder="0.00"/>
                    </td>
                    <td>
                        <input type="number" class="form-control form-control-sm text-end"
                               [(ngModel)]="entries[i].credit"
                               [ngModelOptions]="{ standalone: true }"
                               min="0" placeholder="0.00"/>
                    </td>
                    <td class="text-center">
                        <button type="button"
                                class="btn btn-sm rounded-circle btn-icon"
                                [class.btn-warning]="hasSettings(entry)"
                                [class.btn-light]="!hasSettings(entry)"
                                (click)="openSettings(i)"
                                [ngbTooltip]="hasSettings(entry) ? 'Settings applied' : 'Settings'">
                            <ng-icon name="tablerSettings" class="fs-sm"></ng-icon>
                        </button>
                    </td>
                    <td class="text-center">
                        <button type="button" class="btn btn-danger btn-icon btn-sm rounded-circle"
                                (click)="removeRow(i)" ngbTooltip="Remove row">
                            <ng-icon name="tablerTrash" class="fs-sm"></ng-icon>
                        </button>
                    </td>
                </tr>
            }
            @if (entries.length === 0) {
                <tr><td colspan="5" class="text-center text-muted py-3">
                    No journal entries. Click "Add Row" to start.
                </td></tr>
            }
            @if (entries.length > 0) {
                <tr class="fw-bold bg-light">
                    <td class="text-end text-uppercase fs-xs">Total</td>
                    <td class="text-end fw-bold">{{ debitTotal | number:'1.2-2' }}</td>
                    <td class="text-end fw-bold">{{ creditTotal | number:'1.2-2' }}</td>
                    <td colspan="2"></td>
                </tr>
            }
        </tbody>
    </table>
</div>
