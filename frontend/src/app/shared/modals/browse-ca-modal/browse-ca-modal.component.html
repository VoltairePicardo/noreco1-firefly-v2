<div class="modal-header">
    <h5 class="modal-title fw-bold">Browse Cash Advance</h5>
    <button type="button" class="btn-close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
    @if (loading) {
        <div class="text-center py-4">
            <span class="spinner-border spinner-border-sm me-2" role="status"></span>Loading...
        </div>
    } @else {
        <div class="table-responsive" style="max-height: 420px; overflow-y: auto">
            <table class="table table-custom table-centered table-hover w-100 mb-0">
                <thead class="bg-light align-middle bg-opacity-25 thead-sm">
                    <tr class="text-uppercase fs-xxs">
                        <th>Code</th>
                        <th>Purpose</th>
                        <th class="text-end">Amount</th>
                    </tr>
                </thead>
                <tbody>
                    @if (items.length > 0) {
                        @for (item of items; track item.id) {
                            <tr style="cursor: pointer" (click)="select(item)">
                                <td class="fw-bold text-nowrap">{{ item.localCode || item.code || '—' }}</td>
                                <td>{{ item.purpose || '—' }}</td>
                                <td class="text-end">{{ item.amount | number:'1.2-2' }}</td>
                            </tr>
                        }
                    } @else {
                        <tr>
                            <td colspan="3" class="text-center text-muted py-3">No cash advances found.</td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    }
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-light fw-bold" (click)="activeModal.dismiss()">Close</button>
</div>
