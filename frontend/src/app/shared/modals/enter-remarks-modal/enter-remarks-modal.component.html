<div class="modal-header">
    <h5 class="modal-title">{{ title }}</h5>
    <button type="button" class="btn-close" (click)="close()"></button>
</div>

<div class="modal-body">
    <div class="row">
        <div class="col-12">
            <label class="form-label fw-semibold">Enter Remarks</label>
            <textarea
                class="form-control"
                rows="5"
                placeholder="Enter remarks here..."
                [(ngModel)]="remarks"
            ></textarea>
        </div>
    </div>
</div>

<div class="modal-footer justify-content-end">
    <button
        type="button"
        class="btn btn-light text-dark fw-bold"
        (click)="close()">
        <ng-icon name="tablerX" class="me-1"></ng-icon>
        Cancel
    </button>

    <button
        type="button"
        class="btn btn-primary fw-bold"
        (click)="confirm()">
        <ng-icon name="tablerCheck" class="me-1"></ng-icon>
        Confirm
    </button>
</div>
