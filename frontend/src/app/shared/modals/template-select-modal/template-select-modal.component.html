<div class="modal-header">
    <h4 class="modal-title">Billing Invoice Template</h4>
    <button type="button" class="btn-close" (click)="close()"></button>
</div>

<div class="modal-body">
    <p class="text-muted mb-3">{{ text }}</p>

    <div class="d-flex flex-column gap-2">
        @for (opt of options; track opt.id) {
            <div
                class="card border rounded p-3 cursor-pointer"
                [class.border-primary]="templateOption === opt.id"
                (click)="templateOption = opt.id"
            >
                <div class="form-check m-0">
                    <input
                        class="form-check-input"
                        type="radio"
                        name="templateOption"
                        [value]="opt.id"
                        [(ngModel)]="templateOption"
                        id="template-{{ opt.id }}"
                    />
                    <label class="form-check-label fw-semibold" for="template-{{ opt.id }}">
                        {{ opt.label }}
                    </label>
                </div>
            </div>
        }
    </div>
</div>

<div class="modal-footer">
    <button class="btn btn-light" (click)="close()">Cancel</button>
    <button class="btn btn-primary" (click)="confirm()">Confirm</button>
</div>
