<div class="modal-header">
    <h4 class="modal-title">Browse User</h4>
    <button type="button" class="btn-close" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body">
    <div class="d-flex gap-2 mb-3">
        <div class="app-search flex-grow-1">
            <input ngbAutofocus [(ngModel)]="searchText" type="search" class="form-control"
                   placeholder="Search by name or username" (keyup.enter)="onSearchChange()"/>
            <ng-icon name="tablerSearch" class="app-search-icon text-muted"/>
        </div>
        <button type="button" class="btn btn-success fw-bold" (click)="onSearchChange()">
            <ng-icon name="tablerSearch" class="ps-0 pe-2 fw-bold"/>Search
        </button>
    </div>

    <div class="table-responsive">
        <table class="table table-custom table-centered table-select table-hover w-100 mb-0">
            <thead class="bg-light align-middle bg-opacity-25 thead-sm">
                <tr class="text-uppercase fs-xxs">
                    <th style="width:12%">Account No.</th>
                    <th style="width:40%">Full Name</th>
                    <th>Username</th>
                </tr>
            </thead>
            <tbody>
                @if (loading) {
                    <tr>
                        <td colspan="3" class="text-center py-4">
                            <div class="d-flex justify-content-center align-items-center gap-2 py-2 text-muted">
                                <span class="spinner-border spinner-border-sm"></span>
                                <span>Loading...</span>
                            </div>
                        </td>
                    </tr>
                } @else if (total > 0) {
                    @for (item of items; track item.id) {
                        <tr style="cursor: pointer" (click)="select(item)">
                            <td class="text-muted">{{ item.accountNo ?? '—' }}</td>
                            <td class="fw-bold">{{ item.fullName }}</td>
                            <td>{{ item.username }}</td>
                        </tr>
                    }
                } @else {
                    <tr class="no-results">
                        <td colspan="3" class="text-center text-muted py-3">Nothing found.</td>
                    </tr>
                }
            </tbody>
        </table>
    </div>

    @if (total > 0) {
        <div class="d-flex justify-content-center pagination-boxed align-items-center mt-3">
            <ngb-pagination
                [collectionSize]="total"
                [(page)]="page"
                [pageSize]="pageSize"
                [maxSize]="5"
                [rotate]="true"
                (pageChange)="loadData()">
                <ng-template ngbPaginationPrevious>
                    <ng-icon name="tablerChevronLeft"/>
                </ng-template>
                <ng-template ngbPaginationNext>
                    <ng-icon name="tablerChevronRight"/>
                </ng-template>
            </ngb-pagination>
        </div>
    }
</div>
