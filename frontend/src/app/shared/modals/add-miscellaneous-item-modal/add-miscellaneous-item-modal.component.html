<div class="modal-header">
  <h5 class="modal-title">Add Miscellaneous Item</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="closeDialog()"></button>
</div>

<div class="modal-body">
  <div class="row mb-3">
    <div class="col-md-12">
      <label class="form-label fw-bold">Item</label>
      <div class="app-search">
        <select class="form-select form-control" (change)="itemChanged($event)">
          <option value="" disabled selected>Choose Item</option>
          @for (itemOption of items; track itemOption.id) {
            <option [value]="itemOption.id" [attr.data-item]="itemOption | json">
              {{ itemOption.description }}
            </option>
          }
        </select>
        <ng-icon name="tablerList" class="app-search-icon text-muted"></ng-icon>
      </div>
    </div>
  </div>

  <div class="row mb-3">
    <div class="col-md-6">
      <label class="form-label fw-bold">Amount</label>
      <input
        class="form-control text-end"
        type="number"
        min="0"
        step="0.01"
        [(ngModel)]="item.amount"
        [ngModelOptions]="{standalone: true}">
    </div>
    <div class="col-md-6">
      <label class="form-label fw-bold">VAT Status</label>
      <input
        class="form-control text-center"
        type="text"
        [value]="item.vatable ? 'VATable' : 'Non-VAT'"
        readonly>
    </div>
  </div>
</div>

<div class="modal-footer">
  <div class="d-flex gap-2">
    <button type="button" class="btn btn-light fw-bold" (click)="closeDialog()">
      <ng-icon name="tablerX" class="ps-0 pe-3 fw-bold"></ng-icon>
      <span>Cancel</span>
    </button>
    <button type="button" class="btn btn-primary fw-bold" (click)="addItem()">
      <ng-icon name="tablerCheck" class="ps-0 pe-3 fw-bold"></ng-icon>
      <span>Confirm</span>
    </button>
  </div>
</div>
