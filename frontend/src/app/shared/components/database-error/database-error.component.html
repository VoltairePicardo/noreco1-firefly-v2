<div class="d-flex flex-column align-items-center justify-content-center text-center py-5"
     style="min-height: 60vh;">

    <div style="max-width: 420px;">

        <img src="assets/images/wrong-database.svg"
             alt="Database connection error"
             class="mb-4"
             style="width: 110px; height: auto; filter: grayscale(1) opacity(0.35);">

        <h5 class="fw-semibold text-dark mb-2">Database Connection Issue</h5>

        <p class="text-muted mb-4">{{ message() }}</p>

        <p class="text-muted small mb-0">
            Contact your system administrator if this persists.
        </p>

    </div>

</div>
