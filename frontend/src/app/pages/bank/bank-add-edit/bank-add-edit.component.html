<div class="container-fluid">
    <app-page-title [title]="module" [subTitle]="subModule" [menuLink]="menuLink"/>
</div>

<div class="container-fluid">
    <div class="row">
        <div class="col-xl-12">
            <app-ui-card [title]="module + ' Details'">
                <div class="col-xl-12 p-3" card-body>
                    @if (isLoading()) {
                        <div class="d-flex align-items-center gap-2 text-muted py-2">
                            <span class="spinner-border spinner-border-sm" role="status"></span>
                            Loading...
                        </div>
                    } @else if (validationForm) {
                    <form class="row g-3 needs-validation" novalidate
                          (ngSubmit)="validSubmit()" [formGroup]="validationForm">

                        <div class="row">
                            <div class="col-md-5 mt-2">
                                <label for="name" class="form-label">Name</label>
                                <input id="name" type="text" class="form-control"
                                       placeholder="Name" formControlName="name"
                                       [class]="submit && !form.get('name')?.errors ? 'is-valid'
                                              : submit &&  form.get('name')?.errors ? 'is-invalid' : ''"
                                       required/>
                                <div class="invalid-feedback">Please provide a name.</div>
                            </div>
                            <div class="col-md-5 mt-2">
                                <label for="address" class="form-label">Address</label>
                                <input id="address" type="text" class="form-control"
                                       placeholder="Address" formControlName="address"
                                       [class]="submit && !form.get('address')?.errors ? 'is-valid'
                                              : submit &&  form.get('address')?.errors ? 'is-invalid' : ''"
                                       required/>
                                <div class="invalid-feedback">Please provide an address.</div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-5 mt-2">
                                <label for="contactNumbers" class="form-label">Contact Numbers</label>
                                <input id="contactNumbers" type="text" class="form-control"
                                       placeholder="Contact Numbers" formControlName="contactNumbers"/>
                            </div>
                            <div class="col-md-5 mt-2">
                                <label for="contactPersons" class="form-label">Contact Persons</label>
                                <input id="contactPersons" type="text" class="form-control"
                                       placeholder="Contact Persons" formControlName="contactPersons"/>
                            </div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end align-items-center pt-3 border-top mt-3">
                            <a [routerLink]="['/' + menuLink]" class="btn btn-light fw-bold">
                                <ng-icon name="tablerArrowLeft" class="ps-0 pe-3 fw-bold"></ng-icon>Back
                            </a>
                            <button type="submit" class="btn btn-primary fw-bold" [disabled]="formSubmit">
                                @if (formSubmit) {
                                    <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                                    {{ editMode ? 'Updating...' : 'Saving...' }}
                                } @else {
                                    <ng-icon name="tablerCheck" class="ps-0 pe-3 fw-bold"></ng-icon>
                                    {{ editMode ? 'Update' : 'Save' }}
                                }
                            </button>
                        </div>
                    </form>
                    }
                </div>
            </app-ui-card>
        </div>
    </div>
</div>
