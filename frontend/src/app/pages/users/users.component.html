<div class="container-fluid mt-4">

    <div class="row mb-3 align-items-center">
        <div class="col">
            <h5 class="fw-semibold mb-0">Users</h5>
            <p class="text-muted small mb-0">Manage system user accounts</p>
        </div>
    </div>

    <!-- Search -->
    <div class="card mb-3">
        <div class="card-body py-2 px-3">
            <div class="row g-2 align-items-center">
                <div class="col-md-4">
                    <input
                        type="text"
                        class="form-control form-control-sm"
                        placeholder="Search by name, username or email..."
                        [(ngModel)]="searchText"
                        (ngModelChange)="onSearch()"
                    />
                </div>
                <div class="col-auto ms-auto">
                    <span class="text-muted small">{{ total }} record(s)</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Error -->
    <div *ngIf="error" class="alert alert-danger py-2">{{ error }}</div>

    <!-- Table -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-sm table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Full Name</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th class="text-center" style="width: 90px;">Status</th>
                            <th style="width: 160px;">Created At</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngIf="loading">
                            <td colspan="5" class="text-center text-muted py-4">
                                <span class="spinner-border spinner-border-sm me-2"></span>Loading...
                            </td>
                        </tr>
                        <tr *ngIf="!loading && users.length === 0">
                            <td colspan="5" class="text-center text-muted py-4">No users found.</td>
                        </tr>
                        <tr *ngFor="let u of users">
                            <td>{{ u.fullName || '—' }}</td>
                            <td class="font-monospace small">{{ u.username }}</td>
                            <td class="small">{{ u.email }}</td>
                            <td class="text-center">
                                <span *ngIf="u.enabled" class="badge bg-success-subtle text-success">Active</span>
                                <span *ngIf="!u.enabled" class="badge bg-secondary-subtle text-secondary">Inactive</span>
                            </td>
                            <td class="small text-muted">{{ u.createdAt | date:'MMM d, y' }}</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div *ngIf="totalPages > 1" class="d-flex align-items-center justify-content-between px-3 py-2 border-top">
                <small class="text-muted">
                    Page {{ page + 1 }} of {{ totalPages }}
                </small>
                <nav>
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" [class.disabled]="page === 0">
                            <button class="page-link" (click)="goToPage(page - 1)">&laquo;</button>
                        </li>
                        <ng-container *ngFor="let p of pages">
                            <li class="page-item" [class.active]="p === page" *ngIf="p <= 4 || p >= totalPages - 2 || (p >= page - 1 && p <= page + 1)">
                                <button class="page-link" (click)="goToPage(p)">{{ p + 1 }}</button>
                            </li>
                        </ng-container>
                        <li class="page-item" [class.disabled]="page === totalPages - 1">
                            <button class="page-link" (click)="goToPage(page + 1)">&raquo;</button>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

</div>
