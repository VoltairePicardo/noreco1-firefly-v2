<div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xxl-4 col-xl-5 col-lg-5 col-md-7 col-sm-9">

                <div class="card shadow-sm border-0 rounded-4 p-2">
                    <div class="card-body p-4 text-center">

                        <!-- Brand -->
                        <div class="mb-2">
                            <img ngSrc="noreco1_logo.png" alt="NORECO1 Logo" width="64" height="64" class="mb-2">
                            <div class="text-muted small">{{ appNameExtended }}</div>
                        </div>

                        <div class="mb-3">
                            <img ngSrc="firefly.png" alt="Firefly" width="100" height="48">
                        </div>

                        <hr class="my-3">

                        <!-- Lock icon -->
                        <div class="mb-3">
                            <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-danger bg-opacity-10 mb-3"
                                 style="width:72px;height:72px;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="none"
                                     viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"
                                     class="text-danger" style="color: var(--bs-danger)">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                          d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/>
                                </svg>
                            </div>
                            <div class="fw-bold" style="font-size:4rem;line-height:1;color:var(--bs-danger)">401</div>
                        </div>

                        <h5 class="fw-bold mb-1">Unauthorized Access</h5>
                        <p class="text-muted small mb-4">
                            You don't have permission to view this page.<br>
                            Please sign in with an authorized account.
                        </p>


                    </div>
                </div>

                <p class="text-center text-muted small mt-4 mb-0">
                    &copy; {{ startYear }} {{ appName }} &mdash; by <span class="fw-semibold">{{ credits.name }}</span>
                </p>

            </div>
        </div>
    </div>
</div>
