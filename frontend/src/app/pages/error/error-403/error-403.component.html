<div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xxl-4 col-xl-5 col-lg-5 col-md-7 col-sm-9">

                <div class="card shadow-sm border-0 rounded-4 p-2">
                    <div class="card-body p-4 text-center">

                        <!-- Brand -->
                        <div class="mb-2">
                            <img ngSrc="noreco1_logo.png" alt="NORECO1 Logo" width="64" height="64" class="mb-2">
                            <div class="text-muted small">{{ appNameExtended }}</div>
                        </div>

                        <div class="mb-3">
                            <img ngSrc="firefly.png" alt="Firefly" width="100" height="48">
                        </div>

                        <hr class="my-3">

                        <!-- Shield icon -->
                        <div class="mb-3">
                            <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-warning bg-opacity-10 mb-3"
                                 style="width:72px;height:72px;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="none"
                                     viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"
                                     style="color:var(--bs-warning)">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                          d="M12 9v3.75m0-10.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.75c0 5.592 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.57-.598-3.75h-.152c-3.196 0-6.1-1.25-8.25-3.286Zm0 13.036h.008v.008H12v-.008Z"/>
                                </svg>
                            </div>
                            <div class="fw-bold" style="font-size:4rem;line-height:1;color:var(--bs-warning)">403</div>
                        </div>

                        <h5 class="fw-bold mb-1">Access Forbidden</h5>
                        <p class="text-muted small mb-4">
                            You don't have permission to access this resource.<br>
                            Contact your administrator if you think this is a mistake.
                        </p>


                    </div>
                </div>

                <p class="text-center text-muted small mt-4 mb-0">
                    &copy; {{ startYear }} {{ appName }} &mdash; by <span class="fw-semibold">{{ credits.name }}</span>
                </p>

            </div>
        </div>
    </div>
</div>
