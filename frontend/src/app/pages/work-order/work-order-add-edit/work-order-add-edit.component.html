<div class="container-fluid">
    <app-page-title [title]="module" [subTitle]="subModule" [menuLink]="menuLink"/>
</div>

<div class="container-fluid">
    @if (isLoading() && editMode) {
        <div class="d-flex align-items-center gap-2 text-muted py-4">
            <span class="spinner-border spinner-border-sm" role="status"></span> Loading...
        </div>
    } @else {
    <form (ngSubmit)="save()" #f="ngForm">
        <div class="row g-3">

            <div class="col-xl-12">
                <app-ui-card title="Work Order Information">
                    <div class="col-xl-12 p-3" card-body>
                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Project</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" readonly
                                           [value]="project ? (project.code + ' — ' + project.name) : ''"
                                           placeholder="No project selected"/>
                                    <button type="button" class="btn btn-success fw-bold" (click)="browseProject()">
                                        <ng-icon name="tablerSearch" class="ps-0  pe-3 fw-bold"></ng-icon>Browse
                                    </button>
                                </div>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label fw-bold">Date <span class="text-danger">*</span></label>
                                <input type="text" mwlFlatpickr [options]="flatpickrOptions"
                                       class="form-control" [(ngModel)]="date"
                                       name="date" placeholder="Select date" required/>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label fw-bold">Town <span class="text-danger">*</span></label>
                                <select class="form-select" [(ngModel)]="selectedTown" name="town" required>
                                    <option [ngValue]="null">— Select town —</option>
                                    @for (t of towns; track t.id) {
                                        <option [ngValue]="t">{{ t.name }}</option>
                                    }
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Location</label>
                                <input type="text" class="form-control" [(ngModel)]="location" name="location"
                                       placeholder="Enter location"/>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label fw-bold">Start Date</label>
                                <input type="text" mwlFlatpickr [options]="flatpickrOptions"
                                       class="form-control" [(ngModel)]="startDate"
                                       name="startDate" placeholder="Select start date"/>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label fw-bold">End Date</label>
                                <input type="text" mwlFlatpickr [options]="flatpickrOptions"
                                       class="form-control" [(ngModel)]="endDate"
                                       name="endDate" placeholder="Select end date"/>
                            </div>

                            <!--<div class="col-md-3">
                                <label class="form-label fw-bold">Type <span class="text-danger">*</span></label>
                                <select class="form-select" [(ngModel)]="type" name="type" required>
                                    <option value="">— Select type —</option>
                                    @for (t of workOrderTypes; track t) {
                                        <option [value]="t">{{ t }}</option>
                                    }
                                </select>
                            </div>-->

                            <div class="col-md-12">
                                <label class="form-label fw-bold">Description</label>
                                <textarea class="form-control" [(ngModel)]="description" name="description"
                                          rows="2" maxlength="1024" placeholder="Describe the work to be done"></textarea>
                            </div>

                        </div>

                        <div class="row">
                            <div class="col-xl-12">
                                <div class="d-flex gap-2 justify-content-end align-items-center pt-3 border-top mt-3">
                                    <a [routerLink]="['/' + menuLink]" class="btn btn-light fw-bold">
                                        <ng-icon name="tablerArrowLeft" class="ps-0 pe-3 fw-bold"></ng-icon>Back
                                    </a>
                                    <button type="submit" class="btn btn-primary fw-bold" [disabled]="isLoading()">
                                        @if (isLoading()) {
                                            <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                                            {{ editMode ? 'Updating...' : 'Saving...' }}
                                        } @else {
                                            <ng-icon name="tablerCheck" class="ps-0 pe-3 fw-bold"></ng-icon>
                                            {{ editMode ? 'Update' : 'Save ' + module}}
                                        }
                                    </button>
                                </div>
                            </div>
                        </div>

                    </div>

                </app-ui-card>
            </div>

        </div>
    </form>
    }
</div>
