<div class="container-fluid">
    <app-page-title [title]="module" [subTitle]="subModule" [menuLink]="menuLink"/>
</div>

<div class="container-fluid">
    <div class="row">
        <div class="col-xl-12">
            <app-ui-card [title]="module + ' Details'">
                <div class="col-xl-12 p-3" card-body>
                    @if (isLoading()) {
                        <div class="d-flex align-items-center gap-2 text-muted py-2">
                            <span class="spinner-border spinner-border-sm" role="status"></span>
                            Loading...
                        </div>
                    } @else if (validationForm) {
                    <form class="row g-3 needs-validation" novalidate
                          (ngSubmit)="validSubmit()" [formGroup]="validationForm">

                        <div class="row">
                            <div class="col-md-4 mt-2">
                                <label for="start" class="form-label">Start Date <span class="text-danger">*</span></label>
                                <input id="start" type="text" mwlFlatpickr
                                       [options]="flatpickrOptions"
                                       class="form-control" placeholder="Select start date"
                                       formControlName="start"
                                       [class]="submit && !form.get('start')?.errors ? 'is-valid'
                                              : submit &&  form.get('start')?.errors ? 'is-invalid' : ''"
                                       required/>
                                <div class="invalid-feedback">Please provide a start date.</div>
                            </div>
                            <div class="col-md-4 mt-2">
                                <label for="end" class="form-label">End Date <span class="text-danger">*</span></label>
                                <input id="end" type="text" mwlFlatpickr
                                       [options]="flatpickrOptions"
                                       class="form-control" placeholder="Select end date"
                                       formControlName="end"
                                       [class]="submit && !form.get('end')?.errors ? 'is-valid'
                                              : submit &&  form.get('end')?.errors ? 'is-invalid' : ''"
                                       required/>
                                <div class="invalid-feedback">Please provide an end date.</div>
                            </div>
                        </div>

                        @if (submit && form.errors?.['endBeforeStart']) {
                            <div class="row">
                                <div class="col-md-8">
                                    <div class="alert alert-danger py-2 mb-0">
                                        End date must be later than start date.
                                    </div>
                                </div>
                            </div>
                        }

                        <div class="row">
                            <div class="col-md-8 mt-2">
                                <label for="description" class="form-label">Description</label>
                                <input id="description" type="text" class="form-control"
                                       placeholder="Auto-generated if empty" formControlName="description"/>
                            </div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end align-items-center pt-3 border-top mt-3">
                            <a [routerLink]="['/' + menuLink]" class="btn btn-light fw-bold">
                                <ng-icon name="tablerArrowLeft" class="ps-0 pe-3 fw-bold"></ng-icon>Back
                            </a>
                            <button type="submit" class="btn btn-primary fw-bold" [disabled]="formSubmit">
                                @if (formSubmit) {
                                    <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                                    {{ editMode ? 'Updating...' : 'Saving...' }}
                                } @else {
                                    <ng-icon name="tablerCheck" class="ps-0 pe-3 fw-bold"></ng-icon>
                                    {{ editMode ? 'Update' : 'Save ' + module}}
                                }
                            </button>
                        </div>
                    </form>
                    }
                </div>
            </app-ui-card>
        </div>
    </div>
</div>
