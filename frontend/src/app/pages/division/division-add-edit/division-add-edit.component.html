<div class="container-fluid">
    <app-page-title [title]="module" [subTitle]="subModule" [menuLink]="menuLink"/>
</div>

<div class="container-fluid">
    <div class="row">
        <div class="col-xl-12">
            <app-ui-card [title]="module + ' Details'">
                <div class="col-xl-12 p-3" card-body>
                    @if (isLoading()) {
                        <div class="d-flex align-items-center gap-2 text-muted py-2">
                            <span class="spinner-border spinner-border-sm" role="status"></span>
                            Loading...
                        </div>
                    } @else if (validationForm) {
                    <form class="row g-3 needs-validation" novalidate
                          (ngSubmit)="validSubmit()" [formGroup]="validationForm">

                        <div class="row">
                            <div class="col-md-3 mt-2">
                                <label for="abbreviation" class="form-label">Abbreviation</label>
                                <input id="abbreviation" type="text" class="form-control"
                                       placeholder="Abbreviation" formControlName="abbreviation" maxlength="32"
                                       [class]="submit && !form.get('abbreviation')?.errors ? 'is-valid'
                                              : submit &&  form.get('abbreviation')?.errors ? 'is-invalid' : ''"
                                       required/>
                                <div class="invalid-feedback">Please provide an abbreviation.</div>
                            </div>
                            <div class="col-md-5 mt-2">
                                <label for="name" class="form-label">Name</label>
                                <input id="name" type="text" class="form-control"
                                       placeholder="Name" formControlName="name"
                                       [class]="submit && !form.get('name')?.errors ? 'is-valid'
                                              : submit &&  form.get('name')?.errors ? 'is-invalid' : ''"
                                       required/>
                                <div class="invalid-feedback">Please provide a name.</div>
                            </div>
                            <div class="col-md-4 mt-2">
                                <label for="departmentId" class="form-label">Department</label>
                                <select id="departmentId" class="form-select" formControlName="departmentId"
                                        [class]="submit && !form.get('departmentId')?.errors ? 'is-valid'
                                               : submit &&  form.get('departmentId')?.errors ? 'is-invalid' : ''"
                                        required>
                                    <option [ngValue]="null">-- Select Department --</option>
                                    @for (dept of departments(); track dept.id) {
                                        <option [ngValue]="dept.id">{{ dept.name }}</option>
                                    }
                                </select>
                                <div class="invalid-feedback">Please select a department.</div>
                            </div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end align-items-center pt-3 border-top mt-3">
                            <a [routerLink]="['/' + menuLink]" class="btn btn-light fw-bold">
                                <ng-icon name="tablerArrowLeft" class="ps-0 pe-3 fw-bold"></ng-icon>Back
                            </a>
                            <button type="submit" class="btn btn-primary fw-bold" [disabled]="formSubmit">
                                <ng-icon name="tablerCheck" class="ps-0 pe-3 fw-bold"></ng-icon>
                                {{ editMode ? 'Update' : 'Save' }}
                            </button>
                        </div>
                    </form>
                    }
                </div>
            </app-ui-card>
        </div>
    </div>
</div>
