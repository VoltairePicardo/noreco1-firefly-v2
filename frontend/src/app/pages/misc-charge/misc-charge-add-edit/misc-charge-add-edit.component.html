<div class="container-fluid">
    <app-page-title [title]="module" [subTitle]="subModule" [menuLink]="menuLink"/>
</div>

<div class="container-fluid">
    <div class="row">
        <div class="col-xl-12">
            <app-ui-card [title]="module + ' Details'">
                <div class="col-xl-12 p-3" card-body>
                    @if (isLoading()) {
                        <div class="d-flex align-items-center gap-2 text-muted py-2">
                            <span class="spinner-border spinner-border-sm" role="status"></span>
                            Loading...
                        </div>
                    } @else if (validationForm) {
                    <form class="row g-3 needs-validation" novalidate
                          (ngSubmit)="validSubmit()" [formGroup]="validationForm">

                        <div class="row">
                            <div class="col-md-6 mt-2">
                                <label for="description" class="form-label fw-bold">Description <span class="text-danger">*</span></label>
                                <input id="description" type="text" class="form-control"
                                       placeholder="Enter description" formControlName="description"
                                       [class]="submit && !form.get('description')?.errors ? 'is-valid'
                                              : submit &&  form.get('description')?.errors ? 'is-invalid' : ''"
                                       required/>
                                <div class="invalid-feedback">Please provide a description.</div>
                            </div>
                            <div class="col-md-3 mt-2">
                                <label for="amount" class="form-label fw-bold">Amount <span class="text-danger">*</span></label>
                                <input id="amount" type="number" class="form-control text-end"
                                       placeholder="0.00" formControlName="amount" step="0.01"
                                       [class]="submit && !form.get('amount')?.errors ? 'is-valid'
                                              : submit &&  form.get('amount')?.errors ? 'is-invalid' : ''"
                                       required/>
                                <div class="invalid-feedback">Please provide an amount.</div>
                            </div>
                        </div>

                        <div class="row align-items-end">
                            <div class="col-md-6 mt-2">
                                <label class="form-label fw-bold">Account <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="text" class="form-control" readonly
                                           [value]="getAccountLabel()"
                                           placeholder="Browse an account..."
                                           [class]="submit && form.get('accountId')?.errors ? 'is-invalid'
                                                  : submit && !form.get('accountId')?.errors ? 'is-valid' : ''"/>
                                    <button type="button" class="btn btn-success fw-bold" (click)="openAccountBrowse()">
                                        <ng-icon name="tablerSearch" class="ps-0 pe-2 fw-bold"></ng-icon>Browse
                                    </button>
                                </div>
                                <div class="text-danger small mt-1"
                                     *ngIf="submit && form.get('accountId')?.errors">
                                    Please select an account.
                                </div>
                            </div>
                            <div class="col-md-auto mt-2 pb-2">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="vatable" formControlName="vatable"/>
                                    <label class="form-check-label fw-bold" for="vatable">Vatable</label>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end align-items-center pt-3 border-top mt-3">
                            <a [routerLink]="['/' + menuLink]" class="btn btn-light fw-bold">
                                <ng-icon name="tablerArrowLeft" class="ps-0 pe-3 fw-bold"></ng-icon>Back
                            </a>
                            <button type="submit" class="btn btn-primary fw-bold" [disabled]="formSubmit">
                                <ng-icon name="tablerCheck" class="ps-0 pe-3 fw-bold"></ng-icon>
                                {{ editMode ? 'Update' : 'Save' }}
                            </button>
                        </div>
                    </form>
                    }
                </div>
            </app-ui-card>
        </div>
    </div>
</div>
