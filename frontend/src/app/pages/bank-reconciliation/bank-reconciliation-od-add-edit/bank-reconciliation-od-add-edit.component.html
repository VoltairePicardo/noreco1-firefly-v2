<div class="container-fluid">
    <app-page-title [title]="module" [subTitle]="subModule" [menuLink]="menuLink"/>
</div>

<div class="container-fluid">
    @if (isLoading()) {
        <div class="d-flex align-items-center gap-2 text-muted py-4">
            <span class="spinner-border spinner-border-sm" role="status"></span> Loading...
        </div>
    } @else {
    <div class="row g-3">

        <div class="col-xl-12">
            <app-ui-card title="Other Deposit Details">
                <div class="col-xl-12 p-3" card-body>
                    <form class="row g-3 needs-validation" novalidate (ngSubmit)="save()">

                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                Voucher Date <span class="text-danger">*</span>
                            </label>
                            <input type="text" mwlFlatpickr [options]="flatpickrOptions"
                                   class="form-control" placeholder="Select date"
                                   [(ngModel)]="voucherDate" name="voucherDate"
                                   [class]="submit && !voucherDate ? 'is-invalid' : submit && voucherDate ? 'is-valid' : ''"
                                   required/>
                            <div class="invalid-feedback">Please select a voucher date.</div>
                        </div>

                        <div class="col-md-12">
                            <label class="form-label fw-bold">
                                Account <span class="text-danger">*</span>
                            </label>
                            <div class="input-group"
                                 [class]="submit && !account ? 'is-invalid' : ''">
                                <input type="text" class="form-control"
                                       [value]="account ? (account.accountCode + ' - ' + account.accountTitle) : ''"
                                       readonly placeholder="Select account..."/>
                                <button type="button" class="btn btn-success fw-bold" (click)="openAccBrowse()">
                                    <ng-icon name="tablerSearch" class="ps-0 pe-3 fw-bold"></ng-icon>Browse
                                </button>
                            </div>
                            @if (submit && !account) {
                                <div class="text-danger fs-xs mt-1">Please select an account.</div>
                            }
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Amount</label>
                            <input type="number" class="form-control" placeholder="0.00" min="0"
                                   [(ngModel)]="amount" name="amount"/>
                        </div>

                        <div class="col-md-12">
                            <label class="form-label fw-bold">
                                Particulars <span class="text-danger">*</span>
                            </label>
                            <textarea class="form-control" rows="3" placeholder="Particulars"
                                      [(ngModel)]="particulars" name="particulars"
                                      [class]="submit && !particulars.trim() ? 'is-invalid' : submit && particulars.trim() ? 'is-valid' : ''"
                                      required></textarea>
                            <div class="invalid-feedback">Please enter particulars.</div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end align-items-center pt-3 border-top mt-3">
                            <a [routerLink]="['/' + menuLink]" class="btn btn-light fw-bold">
                                <ng-icon name="tablerArrowLeft" class="ps-0 pe-3 fw-bold"></ng-icon>Back
                            </a>
                            <button type="submit" class="btn btn-primary fw-bold" [disabled]="formSubmit">
                                <ng-icon name="tablerCheck" class="ps-0 pe-3 fw-bold"></ng-icon>
                                {{ editMode ? 'Update' : 'Save' }}
                            </button>
                        </div>

                    </form>
                </div>
            </app-ui-card>
        </div>

    </div>
    }
</div>
