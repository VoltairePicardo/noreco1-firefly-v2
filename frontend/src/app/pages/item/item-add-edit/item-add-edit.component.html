<div class="container-fluid">
    <app-page-title [title]="module" [subTitle]="subModule" [menuLink]="menuLink"/>
</div>

<div class="container-fluid">
    <div class="row">
        <div class="col-xl-12">
            <app-ui-card [title]="module + ' Details'">
                <div class="col-xl-12 p-3" card-body>
                    @if (isLoading()) {
                        <div class="d-flex align-items-center gap-2 text-muted py-2">
                            <span class="spinner-border spinner-border-sm" role="status"></span>
                            Loading...
                        </div>
                    } @else if (validationForm) {
                    <form class="row g-3 needs-validation" novalidate
                          (ngSubmit)="validSubmit()" [formGroup]="validationForm">

                        <div class="row">
                            <div class="col-md-3 mt-2">
                                <label for="code" class="form-label">Code</label>
                                <input id="code" type="text" class="form-control"
                                       placeholder="Item Code" formControlName="code" maxlength="64"/>
                            </div>
                            <div class="col-md-6 mt-2">
                                <label for="description" class="form-label">Description <span class="text-danger">*</span></label>
                                <input id="description" type="text" class="form-control"
                                       placeholder="Item Description" formControlName="description"
                                       [class]="submit && !form.get('description')?.errors ? 'is-valid'
                                              : submit &&  form.get('description')?.errors ? 'is-invalid' : ''"
                                       required/>
                                <div class="invalid-feedback">Please provide a description.</div>
                            </div>
                            <div class="col-md-3 mt-2">
                                <label for="unitId" class="form-label">Unit of Measure</label>
                                <select id="unitId" class="form-select" formControlName="unitId">
                                    <option [ngValue]="null">-- Select Unit --</option>
                                    @for (unit of units(); track unit.id) {
                                        <option [ngValue]="unit.id">{{ unit.code }} - {{ unit.description }}</option>
                                    }
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-3 mt-2">
                                <label for="reorderPoint" class="form-label">Reorder Point</label>
                                <input id="reorderPoint" type="number" class="form-control"
                                       placeholder="0.00" formControlName="reorderPoint" step="0.01"/>
                            </div>
                            <div class="col-md-3 mt-2">
                                <label for="idealQty" class="form-label">Ideal Qty</label>
                                <input id="idealQty" type="number" class="form-control"
                                       placeholder="0.00" formControlName="idealQty" step="0.01"/>
                            </div>
                            <div class="col-md-3 mt-2">
                                <label for="location" class="form-label">Location</label>
                                <input id="location" type="text" class="form-control"
                                       placeholder="Location" formControlName="location"/>
                            </div>
                            <div class="col-md-3 mt-2">
                                <label for="barcode" class="form-label">Barcode</label>
                                <input id="barcode" type="text" class="form-control"
                                       placeholder="Barcode" formControlName="barcode"/>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mt-2">
                                <label for="inventoryCategoryId" class="form-label">Inventory Category</label>
                                <select id="inventoryCategoryId" class="form-select" formControlName="inventoryCategoryId">
                                    <option [ngValue]="null">-- Select Category --</option>
                                    @for (cat of categories(); track cat.id) {
                                        <option [ngValue]="cat.id">{{ cat.description }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-4 mt-2">
                                <label class="form-label">Asset Account</label>
                                <div class="input-group">
                                    <input type="text" class="form-control"
                                           [value]="selectedAssetAccount ? (selectedAssetAccount.accountCode + ' — ' + selectedAssetAccount.accountTitle) : ''"
                                           readonly placeholder="Browse Asset Account"/>
                                    @if (selectedAssetAccount) {
                                        <button type="button" class="btn btn-danger fw-bold" (click)="clearAssetAccount()">
                                            <ng-icon name="tablerX" class="fw-bold"></ng-icon>
                                        </button>
                                    } @else {
                                        <button type="button" class="btn btn-success fw-bold" (click)="openAssetAccountBrowse()">
                                            <ng-icon name="tablerSearch" class="ps-0 pe-3 fw-bold"></ng-icon>Browse
                                        </button>
                                    }
                                </div>
                            </div>
                            <div class="col-md-4 mt-2">
                                <label class="form-label">Expense Account</label>
                                <div class="input-group">
                                    <input type="text" class="form-control"
                                           [value]="selectedExpenseAccount ? (selectedExpenseAccount.accountCode + ' — ' + selectedExpenseAccount.accountTitle) : ''"
                                           readonly placeholder="Browse Expense Account"/>
                                    @if (selectedExpenseAccount) {
                                        <button type="button" class="btn btn-danger fw-bold" (click)="clearExpenseAccount()">
                                            <ng-icon name="tablerX" class="fw-bold"></ng-icon>
                                        </button>
                                    } @else {
                                        <button type="button" class="btn btn-success fw-bold" (click)="openExpenseAccountBrowse()">
                                            <ng-icon name="tablerSearch" class="ps-0 pe-3 fw-bold"></ng-icon>Browse
                                        </button>
                                    }
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-2 mt-3">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="isActive" formControlName="isActive"/>
                                    <label class="form-check-label" for="isActive">Active</label>
                                </div>
                            </div>
                            <div class="col-md-2 mt-3">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="hasSerialNumbers" formControlName="hasSerialNumbers"/>
                                    <label class="form-check-label" for="hasSerialNumbers">Has Serial Numbers</label>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-5 mt-2">
                                <label class="form-label">Item Picture</label>
                                <input type="file" class="form-control"
                                       accept=".jpg,.jpeg,.png"
                                       (change)="onImageChange($event)"/>
                                <div class="form-text">Accepted formats: .jpg, .jpeg, .png</div>
                                @if (imagePreview) {
                                    <div class="mt-2">
                                        <img [src]="imagePreview" alt="Preview"
                                             class="img-thumbnail"
                                             style="max-width: 200px; max-height: 200px; object-fit: contain;"/>
                                    </div>
                                }
                            </div>
                        </div>

                                                <div class="d-flex gap-2 justify-content-end align-items-center pt-3 border-top mt-3">
                            <a [routerLink]="['/' + menuLink]" class="btn btn-light fw-bold">
                                <ng-icon name="tablerArrowLeft" class="ps-0 pe-3 fw-bold"></ng-icon>Back
                            </a>
                            <button type="submit" class="btn btn-primary fw-bold" [disabled]="formSubmit">
                                @if (formSubmit) {
                                    <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                                    {{ editMode ? 'Updating...' : 'Saving...' }}
                                } @else {
                                    <ng-icon name="tablerCheck" class="ps-0 pe-3 fw-bold"></ng-icon>
                                    {{ editMode ? 'Update' : 'Save ' + module }}
                                }
                            </button>
                        </div>
                    </form>
                    }
                </div>
            </app-ui-card>
        </div>
    </div>
</div>
