<div class="container-fluid">
    <app-page-title [title]="module" [subTitle]="subModule" [menuLink]="menuLink"/>
</div>

<div class="card">
    <div class="row">
        <div class="col-xl-12">
            <div class="card-body">

                <div class="row mb-2 align-items-center">
                    <div class="col-md-3 mt-2">
                        <div class="app-search">
                            <input type="text" class="form-control my-1 my-md-0"
                                   placeholder="Search by description..."
                                   [(ngModel)]="searchText"
                                   (keyup.enter)="search()"
                                   [ngModelOptions]="{ standalone: true }"/>
                            <ng-icon name="tablerSearch" class="app-search-icon text-muted"></ng-icon>
                        </div>
                    </div>
                    <div class="col-md-2 mt-2 d-flex gap-2">
                        <div class="app-search flex-grow-1">
                            <button type="button" class="btn btn-success w-100 fw-bold" (click)="search()">
                                <ng-icon name="tablerSearch" class="ps-0 pe-3 fw-bold"></ng-icon>Search
                            </button>
                        </div>
                        <div class="app-search flex-grow-1">
                            <button type="button" class="btn btn-danger w-100 fw-bold" (click)="clearSearch()">
                                <ng-icon name="tablerRefresh" class="ps-0 pe-3 fw-bold"></ng-icon>Reset
                            </button>
                        </div>
                    </div>
                    <div class="col-md-7 d-flex justify-content-end gap-2">
                        <div class="col-auto mt-2">
                            <button type="button" class="btn btn-light fw-bold"
                                    [routerLink]="['/' + menuLink]">
                                <ng-icon name="tablerArrowLeft" class="ps-0 pe-2 fw-bold"></ng-icon>Back to List
                            </button>
                        </div>
                        <div class="col-auto mt-2">
                            <button type="button" class="btn btn-primary d-flex align-items-center gap-2 fw-bold"
                                    [routerLink]="['/' + menuLink + '/types/create']">
                                <ng-icon name="tablerPlus" class="fw-bold"></ng-icon>
                                Create Assembly Type
                            </button>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="table-responsive">
                        <table class="table table-custom table-centered table-select table-hover w-100 mb-0">
                            <thead class="bg-light align-middle bg-opacity-25 thead-sm">
                                <tr class="text-uppercase fs-xxs">
                                    <th>Description</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                @if (assemblyTypes().length > 0) {
                                    @for (type of assemblyTypes(); track type.id) {
                                        <tr>
                                            <td>{{ type.description || '—' }}</td>
                                            <td class="text-nowrap">
                                                <div class="d-flex justify-content-end gap-1">
                                                    <a href="javascript:void(0)" ngbTooltip="Edit"
                                                       [routerLink]="['/' + menuLink + '/types', type.id, 'edit']"
                                                       class="btn btn-light btn-icon btn-sm rounded-circle">
                                                        <ng-icon name="tablerEdit" class="fs-lg"></ng-icon>
                                                    </a>
                                                </div>
                                            </td>
                                        </tr>
                                    }
                                } @else {
                                    <tr class="no-results">
                                        <td colspan="2" class="text-center text-muted py-3">
                                            @if (isLoading()) {
                                                <span class="spinner-border spinner-border-sm me-2" role="status"></span>Loading...
                                            } @else { Nothing found. }
                                        </td>
                                    </tr>
                                }
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
