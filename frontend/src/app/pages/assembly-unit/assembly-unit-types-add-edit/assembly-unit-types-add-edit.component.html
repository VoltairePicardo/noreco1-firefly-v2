<div class="container-fluid">
    <app-page-title [title]="module" [subTitle]="subModule" [menuLink]="menuLink"/>
</div>

<div class="container-fluid">
    <div class="row">
        <div class="col-xl-12">
            <app-ui-card [title]="'Assembly Type Details'">
                <div class="col-xl-12 p-3" card-body>
                    @if (isLoading()) {
                        <div class="d-flex align-items-center gap-2 text-muted py-2">
                            <span class="spinner-border spinner-border-sm" role="status"></span>
                            Loading...
                        </div>
                    } @else if (validationForm) {
                    <form class="row g-3 needs-validation" novalidate
                          (ngSubmit)="validSubmit()" [formGroup]="validationForm">

                        <div class="row">
                            <div class="col-md-6 mt-2">
                                <label for="description" class="form-label fw-bold">Description <span class="text-danger">*</span></label>
                                <input id="description" type="text" class="form-control"
                                       placeholder="Assembly Type Description" formControlName="description"
                                       [class]="submit && !form.get('description')?.errors ? 'is-valid'
                                              : submit &&  form.get('description')?.errors ? 'is-invalid' : ''"
                                       required/>
                                <div class="invalid-feedback">Please provide a description.</div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mt-2">
                                <label class="form-label fw-bold">Asset Account</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" readonly
                                           [value]="getAccountLabel(selectedAssetAccount)"
                                           placeholder="Browse an account..."/>
                                    <button type="button" class="btn btn-success fw-bold"
                                            (click)="openAccountBrowse('asset')">
                                        <ng-icon name="tablerSearch" class="ps-0 pe-2 fw-bold"></ng-icon>Browse
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mt-2">
                                <label class="form-label fw-bold">Expense Account</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" readonly
                                           [value]="getAccountLabel(selectedExpenseAccount)"
                                           placeholder="Browse an account..."/>
                                    <button type="button" class="btn btn-success fw-bold"
                                            (click)="openAccountBrowse('expense')">
                                        <ng-icon name="tablerSearch" class="ps-0 pe-2 fw-bold"></ng-icon>Browse
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mt-2">
                                <label class="form-label fw-bold">Accu. Dep. Account</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" readonly
                                           [value]="getAccountLabel(selectedAccuDepAccount)"
                                           placeholder="Browse an account..."/>
                                    <button type="button" class="btn btn-success fw-bold"
                                            (click)="openAccountBrowse('accuDep')">
                                        <ng-icon name="tablerSearch" class="ps-0 pe-2 fw-bold"></ng-icon>Browse
                                    </button>
                                </div>
                            </div>
                        </div>

                        <hr/>

                                                <div class="d-flex gap-2 justify-content-end align-items-center pt-3 border-top mt-3">
                            <a [routerLink]="['/' + menuLink + '/types']" class="btn btn-light fw-bold">
                                <ng-icon name="tablerArrowLeft" class="ps-0 pe-3 fw-bold"></ng-icon>Back
                            </a>
                            <button type="submit" class="btn btn-primary fw-bold" [disabled]="formSubmit">
                                @if (formSubmit) {
                                    <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                                    {{ editMode ? 'Updating...' : 'Saving...' }}
                                } @else {
                                    <ng-icon name="tablerCheck" class="ps-0 pe-3 fw-bold"></ng-icon>
                                    {{ editMode ? 'Update' : 'Save ' + module }}
                                }
                            </button>
                        </div>
                    </form>
                    }
                </div>
            </app-ui-card>
        </div>
    </div>
</div>
