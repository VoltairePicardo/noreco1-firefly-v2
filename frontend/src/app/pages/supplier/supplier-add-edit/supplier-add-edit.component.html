<div class="container-fluid">
    <app-page-title [title]="module" [subTitle]="subModule" [menuLink]="menuLink"/>
</div>

<div class="container-fluid">
    <div class="row">
        <div class="col-xl-12">
            <app-ui-card [title]="module + ' Details'">
                <div class="col-xl-12 p-3" card-body>
                    @if (isLoading()) {
                        <div class="d-flex align-items-center gap-2 text-muted py-2">
                            <span class="spinner-border spinner-border-sm" role="status"></span>
                            Loading...
                        </div>
                    } @else if (validationForm) {
                    <form class="row g-3 needs-validation" novalidate
                          (ngSubmit)="validSubmit()" [formGroup]="validationForm">

                        <div class="row">
                            <div class="col-md-6 mt-2">
                                <label for="name" class="form-label">Name <span class="text-danger">*</span></label>
                                <input id="name" type="text" class="form-control"
                                       placeholder="Supplier Name" formControlName="name"
                                       [class]="submit && !form.get('name')?.errors ? 'is-valid'
                                              : submit &&  form.get('name')?.errors ? 'is-invalid' : ''"
                                       required/>
                                <div class="invalid-feedback">Please provide a name.</div>
                            </div>
                            <div class="col-md-6 mt-2">
                                <label for="address" class="form-label">Address</label>
                                <input id="address" type="text" class="form-control"
                                       placeholder="Address" formControlName="address"/>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-3 mt-2">
                                <label for="phone" class="form-label">Phone</label>
                                <input id="phone" type="text" class="form-control"
                                       placeholder="Phone" formControlName="phone"/>
                            </div>
                            <div class="col-md-3 mt-2">
                                <label for="fax" class="form-label">Fax</label>
                                <input id="fax" type="text" class="form-control"
                                       placeholder="Fax" formControlName="fax"/>
                            </div>
                            <div class="col-md-3 mt-2">
                                <label for="email" class="form-label">Email</label>
                                <input id="email" type="email" class="form-control"
                                       placeholder="Email" formControlName="email"/>
                            </div>
                            <div class="col-md-3 mt-2">
                                <label for="zip" class="form-label">ZIP</label>
                                <input id="zip" type="text" class="form-control"
                                       placeholder="ZIP" formControlName="zip"/>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mt-2">
                                <label for="contactPerson" class="form-label">Contact Person</label>
                                <input id="contactPerson" type="text" class="form-control"
                                       placeholder="Contact Person" formControlName="contactPerson"/>
                            </div>
                            <div class="col-md-4 mt-2">
                                <label for="contactPersonPosition" class="form-label">Contact Person Position</label>
                                <input id="contactPersonPosition" type="text" class="form-control"
                                       placeholder="Position" formControlName="contactPersonPosition"/>
                            </div>
                            <div class="col-md-4 mt-2">
                                <label for="tin" class="form-label">TIN</label>
                                <input id="tin" type="text" class="form-control"
                                       placeholder="xxx-xxx-xxx-xxx" formControlName="tin"/>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mt-2">
                                <label for="bankAccountNumber" class="form-label">Bank Account Number</label>
                                <input id="bankAccountNumber" type="text" class="form-control"
                                       placeholder="Bank Account Number" formControlName="bankAccountNumber"/>
                            </div>
                            <div class="col-md-3 mt-2">
                                <label for="creditLimit" class="form-label">Credit Limit</label>
                                <input id="creditLimit" type="number" class="form-control"
                                       placeholder="0.00" formControlName="creditLimit" step="0.01"/>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-8 mt-2">
                                <label for="remarks" class="form-label">Remarks</label>
                                <textarea id="remarks" class="form-control" rows="2"
                                          placeholder="Remarks" formControlName="remarks"></textarea>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-2 mt-3">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="vatable" formControlName="vatable"/>
                                    <label class="form-check-label" for="vatable">Vatable</label>
                                </div>
                            </div>
                            <div class="col-md-2 mt-3">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="accredited" formControlName="accredited"/>
                                    <label class="form-check-label" for="accredited">Accredited</label>
                                </div>
                            </div>
                            <div class="col-md-2 mt-3">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="status" formControlName="status"/>
                                    <label class="form-check-label" for="status">Active</label>
                                </div>
                            </div>
                        </div>

                                                <div class="d-flex gap-2 justify-content-end align-items-center pt-3 border-top mt-3">
                            <a [routerLink]="['/' + menuLink]" class="btn btn-light fw-bold">
                                <ng-icon name="tablerArrowLeft" class="ps-0 pe-3 fw-bold"></ng-icon>Back
                            </a>
                            <button type="submit" class="btn btn-primary fw-bold" [disabled]="formSubmit">
                                <ng-icon name="tablerCheck" class="ps-0 pe-3 fw-bold"></ng-icon>
                                {{ editMode ? 'Update' : 'Save ' + module}}
                            </button>
                        </div>
                    </form>
                    }
                </div>
            </app-ui-card>
        </div>
    </div>
</div>
