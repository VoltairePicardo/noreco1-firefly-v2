<div class="container-fluid">
    <app-page-title [title]="module" [subTitle]="subModule" [menuLink]="menuLink"/>
</div>

<div class="container-fluid">
    <div class="row">
        <div class="col-xl-12">
            <app-ui-card [title]="module + ' Form'">
                <div class="col-xl-12 p-3" card-body>

                    @if (isLoading()) {
                        <div class="d-flex align-items-center gap-2 text-muted py-2">
                            <span class="spinner-border spinner-border-sm" role="status"></span> Loading...
                        </div>
                    } @else {

                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Year <span class="text-danger">*</span></label>
                            <input type="number" class="form-control"
                                   [(ngModel)]="year" [ngModelOptions]="{ standalone: true }"
                                   placeholder="e.g. 2025" min="2000" max="2100"/>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Month <span class="text-danger">*</span></label>
                            <select class="form-select" [(ngModel)]="month" [ngModelOptions]="{ standalone: true }">
                                <option [ngValue]="null">— Select Month —</option>
                                @for (m of months; track m.value) {
                                    <option [ngValue]="m.value">{{ m.label }}</option>
                                }
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Status <span class="text-danger">*</span></label>
                            <select class="form-select" [(ngModel)]="status" [ngModelOptions]="{ standalone: true }">
                                <option value="OPEN">OPEN</option>
                                <option value="CLOSE">CLOSE</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex gap-2 justify-content-end align-items-center pt-3 border-top mt-3">
                        <a [routerLink]="['/' + menuLink]" class="btn btn-light fw-bold">
                            <ng-icon name="tablerArrowLeft" class="ps-0 pe-3 fw-bold"></ng-icon>Back
                        </a>
                        <button type="button" class="btn btn-primary fw-bold"
                                [disabled]="formSubmit" (click)="save()">
                            @if (formSubmit) {
                                <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                            } @else {
                                <ng-icon name="tablerCheck" class="ps-0 pe-3 fw-bold"></ng-icon>
                            }
                            {{ editMode ? 'Update' : 'Save ' + module }}
                        </button>
                    </div>

                    }
                </div>
            </app-ui-card>
        </div>
    </div>
</div>
