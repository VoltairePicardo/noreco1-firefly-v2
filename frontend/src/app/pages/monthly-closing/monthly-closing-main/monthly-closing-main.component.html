<div class="container-fluid">
    <app-page-title [title]="module" [subTitle]="subModule" [menuLink]="menuLink"/>
</div>

<div class="card">
    <div class="row">
        <div class="col-xl-12">
            <div class="card-body">

                <!-- Filters -->
                <div class="row mb-3 align-items-end g-2">
                    <div class="col-md-3">
                        <label class="form-label fw-bold mb-1 fs-xs text-uppercase">Search</label>
                        <input type="text" class="form-control" [(ngModel)]="searchText"
                               placeholder="Search by month/year or status..." (ngModelChange)="page = 1"/>
                    </div>
                    <div class="col-auto d-flex gap-2">
                        <button type="button" class="btn btn-success fw-bold" (click)="load()">
                            <ng-icon name="tablerRefresh" class="ps-0 pe-3 fw-bold"></ng-icon>Refresh
                        </button>
                    </div>
                    <div class="col-md-auto ms-auto">
                        <button type="button" class="btn btn-primary d-flex align-items-center gap-2 fw-bold"
                                [routerLink]="['/' + menuLink + '/create']">
                            <ng-icon name="tablerPlus" class="fw-bold"></ng-icon>
                            Create {{ module }}
                        </button>
                    </div>
                </div>

                <div class="row">
                    <div class="table-responsive">
                        <table class="table table-custom table-centered table-select table-hover w-100 mb-0">
                            <thead class="bg-light align-middle bg-opacity-25 thead-sm">
                                <tr class="text-uppercase fs-xxs">
                                    <th>Cycle (Month / Year)</th>
                                    <th>Status</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                @if (pagedRecords.length > 0) {
                                    @for (rec of pagedRecords; track rec.id) {
                                        <tr>
                                            <td class="fw-bold">{{ formatMonth(rec.year, rec.month) }}</td>
                                            <td>
                                                <span class="badge fw-bold"
                                                      [class.bg-success]="rec.status === 'OPEN'"
                                                      [class.bg-danger]="rec.status === 'CLOSE'"
                                                      [class.bg-secondary]="rec.status !== 'OPEN' && rec.status !== 'CLOSE'">
                                                    {{ rec.status }}
                                                </span>
                                            </td>
                                            <td class="text-nowrap">
                                                <div class="d-flex justify-content-end gap-1">
                                                    <a href="javascript:void(0)" ngbTooltip="View"
                                                       [routerLink]="['/' + menuLink, rec.id, 'detail']"
                                                       class="btn btn-light btn-icon btn-sm rounded-circle">
                                                        <ng-icon name="tablerEye" class="fs-lg"></ng-icon>
                                                    </a>
                                                    <a href="javascript:void(0)" ngbTooltip="Edit"
                                                       [routerLink]="['/' + menuLink, rec.id, 'edit']"
                                                       class="btn btn-light btn-icon btn-sm rounded-circle">
                                                        <ng-icon name="tablerEdit" class="fs-lg"></ng-icon>
                                                    </a>
                                                </div>
                                            </td>
                                        </tr>
                                    }
                                } @else {
                                    <tr class="no-results">
                                        <td colspan="3" class="text-center text-muted py-3">
                                            @if (isLoading()) {
                                                <span class="spinner-border spinner-border-sm me-2" role="status"></span>Loading...
                                            } @else { Nothing found. }
                                        </td>
                                    </tr>
                                }
                            </tbody>
                        </table>
                    </div>
                </div>

                @if (filteredRecords.length > pageSize) {
                    <div class="d-flex justify-content-center mt-3">
                        <ngb-pagination
                            [collectionSize]="filteredRecords.length"
                            [(page)]="page"
                            [pageSize]="pageSize"
                            [maxSize]="5">
                        </ngb-pagination>
                    </div>
                }

            </div>
        </div>
    </div>
</div>
