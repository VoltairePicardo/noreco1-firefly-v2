<div class="container-fluid">
    <app-page-title [title]="'Inventory Reports'" [subTitle]="module" [menuLink]="menuLink" [useSubtitleAsTitle]="true"/>
</div>

<div class="container-fluid">
    <div class="card">
        <div class="card-body">

            <div class="row g-2 align-items-end">
                <div class="col-md-12">
                    <div class="d-flex gap-2 justify-content-end">
                        <button type="button" class="btn btn-success fw-bold" (click)="export('pdf')">
                            <ng-icon name="tablerFileTypePdf" class="fw-bold me-1"></ng-icon>Export PDF
                        </button>
                        <button type="button" class="btn btn-success fw-bold" (click)="export('xls')">
                            <ng-icon name="tablerFileTypeXls" class="fw-bold me-1"></ng-icon>Export Excel
                        </button>
                    </div>
                </div>
            </div>

            <div class="row g-2 align-items-end mb-3">
                <div class="col-md-2">
                    <label class="form-label fw-bold mb-1">From</label>
                    <input type="text" mwlFlatpickr [options]="flatpickrOptions"
                           class="form-control" [(ngModel)]="fromDate" placeholder="From date"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold mb-1">To</label>
                    <input type="text" mwlFlatpickr [options]="flatpickrOptions"
                           class="form-control" [(ngModel)]="toDate" placeholder="To date"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold mb-1">Inventory Location</label>
                    <select class="form-select" [(ngModel)]="selectedLocationId" (change)="onLocationChange()">
                        <option [ngValue]="0">— Select location —</option>
                        @for (loc of inventoryLocations(); track loc.id) {
                            <option [ngValue]="loc.id">{{ loc.description ?? loc.name }}</option>
                        }
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold mb-1">Item</label>
                    <div class="input-group">
                        <input type="text" class="form-control"
                               [value]="selectedItem ? (selectedItem.code + ' — ' + selectedItem.description) : ''"
                               readonly placeholder="Select location first, then browse item..."/>
                        <button type="button" class="btn btn-success fw-bold" (click)="browseItem()">
                            <ng-icon name="tablerSearch" class="fw-bold me-1"></ng-icon>Browse
                        </button>
                    </div>
                </div>
                <div class="col-md-2">
                    <button type="button" class="btn btn-success fw-bold" (click)="search()">
                        <ng-icon name="tablerSearch" class="fw-bold me-1"></ng-icon>Search
                    </button>
                </div>
            </div>

            <div class="table-responsive mt-3">
                <table class="table table-custom table-centered table-select table-hover w-100 mb-0">
                    <thead class="bg-light align-middle bg-opacity-25 thead-sm">
                        <tr class="text-uppercase fs-xxs">
                            <th>Date</th>
                            <th>Reference</th>
                            <th>Purpose</th>
                            <th>In</th>
                            <th>Out</th>
                            <th>Balance</th>
                        </tr>
                    </thead>
                    <tbody>
                        @if (isLoading()) {
                            <tr><td colspan="6" class="text-center text-muted py-3">
                                <span class="spinner-border spinner-border-sm me-2"></span>Loading...
                            </td></tr>
                        } @else if (rows().length === 0) {
                            <tr><td colspan="6" class="text-center text-muted py-3">No records found.</td></tr>
                        } @else {
                            @for (row of rows(); track $index) {
                                <tr>
                                    <td>{{ row.date }}</td>
                                    <td>{{ row.refNo }}</td>
                                    <td>{{ row.purpose }}</td>
                                    <td>{{ row.ins }}</td>
                                    <td>{{ row.outs }}</td>
                                    <td>{{ row.balance }}</td>
                                </tr>
                            }
                        }
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>
