<div class="sidenav-user">
  <div class="d-flex align-items-center gap-2">
    <img src="assets/images/users/user-2.jpg" alt="user-image"
         class="rounded-circle avatar-md flex-shrink-0">
    <div class="overflow-hidden">
      <span class="sidenav-user-name fw-bold d-block text-truncate"
            [ngbTooltip]="user.fullName" placement="right" container="body">{{user.fullName}}</span>
      @if (user.position) {
        <hr class="my-1">
        <span class="fs-12 fw-semibold d-block text-truncate">{{user.position}}</span>
      }
    </div>
  </div>
</div>
